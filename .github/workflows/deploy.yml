name: Deploy Trade Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Locate static output directory
        id: out
        run: |
          echo "Files in project:"
          ls -la
          echo "Directories:"
          find . -maxdepth 2 -type d
          # Find the directory that actually contains the generated top-level index.html
          INDEX=$(find dist .output -maxdepth 3 -name index.html -not -path '*/server/*' 2>/dev/null | head -n 1)
          if [ -z "$INDEX" ]; then
            echo "ERROR: no index.html found in build output" >&2
            exit 1
          fi
          DIR=$(dirname "$INDEX")
          echo "Static output directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Add SPA fallback for GitHub Pages
        run: cp "${{ steps.out.outputs.dir }}/index.html" "${{ steps.out.outputs.dir }}/404.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
